<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TVU Go Pill</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /*
    TVU Go creator code pill (OBS browser source, 1920x1080, transparent). Stays on screen.

      ?code=GOKEEM     creator code
      &pos=bl          bl | br | tl | tr | bc | tc   (corner, default bottom-left)
      &scale=1         size, e.g. 1.3 or 0.8
      &free=1          0 hides the "1 month free" part
      &glint=45        seconds between the green glint (0 = off)
  */
  :root { --green: #2AC93A; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent;
    font-family: Inter, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  body.preview { background: radial-gradient(circle at 30% 40%, #3b4b57, #1b2228); }

  .pill { position: absolute; display: inline-flex; align-items: center; gap: 12px; height: 52px; padding: 0 22px 0 7px;
    background: rgba(10,10,11,.88); border: 1.5px solid rgba(42,201,58,.55); border-radius: 999px;
    box-shadow: 0 8px 24px rgba(0,0,0,.35); white-space: nowrap; overflow: hidden;
    transform: scale(var(--s,1)); opacity: 0; transition: opacity .6s ease; }
  .pill.on { opacity: 1; }
  .bl .pill { left: 40px; bottom: 40px; transform-origin: left bottom; }
  .br .pill { right: 40px; bottom: 40px; transform-origin: right bottom; }
  .tl .pill { left: 40px; top: 40px; transform-origin: left top; }
  .tr .pill { right: 40px; top: 40px; transform-origin: right top; }
  .bc .pill { left: 50%; bottom: 40px; transform: translateX(-50%) scale(var(--s,1)); transform-origin: center bottom; }
  .tc .pill { left: 50%; top: 40px; transform: translateX(-50%) scale(var(--s,1)); transform-origin: center top; }

  .badge { height: 38px; padding: 0 14px; border-radius: 999px; background: var(--green); color: #04140a;
    display: flex; align-items: center; font-weight: 800; font-size: 18px; letter-spacing: .6px; }
  .lbl { font-size: 18px; font-weight: 600; color: rgba(255,255,255,.72); }
  .code { font-size: 22px; font-weight: 800; letter-spacing: 1.5px; color: var(--green); }
  .free { font-size: 18px; font-weight: 600; color: #fff; padding-left: 12px; border-left: 1px solid rgba(255,255,255,.2); }
  .nofree .free { display: none; }

  /* glint: a soft light sweep + glow, every few seconds */
  .pill::after { content: ""; position: absolute; top: 0; bottom: 0; left: -40%; width: 30%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.22), transparent); transform: skewX(-18deg); opacity: 0; }
  .pill.glint { animation: glow 1.6s ease; }
  .pill.glint::after { animation: sweep 1.2s ease .1s; }
  @keyframes sweep { 0% { left: -40%; opacity: 1; } 100% { left: 120%; opacity: 1; } }
  @keyframes glow { 0%,100% { box-shadow: 0 8px 24px rgba(0,0,0,.35); } 45% { box-shadow: 0 0 0 5px rgba(42,201,58,.22), 0 0 26px rgba(42,201,58,.55); } }
</style>
</head>
<body>
<div class="pill" id="pill">
  <div class="badge">TVU GO</div>
  <span class="lbl">Code</span><span class="code" id="code"></span>
  <span class="free">1 month free</span>
</div>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const CODE = (q.get('code') || 'GOCASH').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 16);
  const POS = ['bl', 'br', 'tl', 'tr', 'bc', 'tc'].includes(q.get('pos')) ? q.get('pos') : 'bl';
  const SCALE = Math.min(2, Math.max(.4, parseFloat(q.get('scale') || '1') || 1));
  const GLINT = q.has('glint') ? Math.max(0, parseFloat(q.get('glint')) || 0) : 45;
  const pill = document.getElementById('pill');

  document.body.classList.add(POS);
  if (q.get('free') === '0') document.body.classList.add('nofree');
  if (!window.obsstudio) document.body.classList.add('preview');
  pill.style.setProperty('--s', SCALE);
  document.getElementById('code').textContent = CODE;

  const glint = () => { pill.classList.remove('glint'); void pill.offsetWidth; pill.classList.add('glint'); };
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
    pill.classList.add('on');
    setTimeout(glint, 900);
    if (GLINT > 0) setInterval(glint, GLINT * 1000);
  });
  addEventListener('click', glint);
})();
</script>
</body>
</html>
